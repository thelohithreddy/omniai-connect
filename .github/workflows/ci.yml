name: CI

on:
  # Every branch, not just the trunk. The development process is module-based —
  # implement, verify locally, push, get CI green, audit, next module — and that only
  # works if a push to `feat/*` or `fix/*` is actually verified. Previously the trigger
  # listed [main, develop], so a feature-branch push dispatched nothing and a module was
  # first seen by CI at PR time, long after it was declared done.
  #
  # `'**'` matches all branch names including those with slashes. It deliberately does
  # not match tags: there is no release pipeline yet, and a tag push should not silently
  # start running jobs that were written for branches.
  push:
    branches: ['**']
  # Unchanged. PRs are still verified against their target, which is what a merge gate
  # needs — the push trigger above verifies the branch, this verifies the merge.
  pull_request:
    branches: [main, develop]

concurrency:
  # Keyed on `head_ref || ref` rather than `ref` alone, which is what stops the broader
  # push trigger from doubling the work. Once a branch has an open PR, one commit fires
  # both `push` (ref = refs/heads/my-branch) and `pull_request` (ref =
  # refs/pull/N/merge). Under the old key those are different groups, so both runs
  # proceed and every PR commit costs two full CI runs. `head_ref` is the source branch
  # on a PR event and empty on a push, so this expression collapses both events for the
  # same branch into one group and `cancel-in-progress` retires the superseded run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest

    # Better Auth stores users, sessions and signing keys in Postgres, and the auth contract
    # suite drives its real handler against real rows. Mocking the database here would leave
    # the assertions that matter — that sign-out deletes a session, that a wrong password is
    # refused — testing a fake instead of the thing being shipped.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omniai
          POSTGRES_PASSWORD: omniai
          POSTGRES_DB: omniai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omniai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_DATABASE_URL: postgresql://omniai_identity:omniai_identity@localhost:5432/omniai

    steps:
      - uses: actions/checkout@v4
      # No `version:` input on purpose. package.json pins `packageManager: pnpm@9.15.0`,
      # and pnpm/action-setup@v4 errors out when its `version` input disagrees with that
      # field. Letting the action read packageManager keeps one source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # --frozen-lockfile: fail on lockfile drift rather than silently resolving to
      # different versions than a developer has locally (P-59). The previous
      # --no-frozen-lockfile defeated the committed lockfile entirely.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # Same provisioning as infra/docker/postgres-init/02-identity-role.sh, which service
      # containers never run. Better Auth owns this schema and migrates it itself.
      - name: Provision the Better Auth identity schema
        run: |
          PGPASSWORD=omniai psql -h localhost -U omniai -d omniai -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE omniai_identity LOGIN PASSWORD 'omniai_identity';
          GRANT CONNECT ON DATABASE omniai TO omniai_identity;
          CREATE SCHEMA IF NOT EXISTS identity AUTHORIZATION omniai_identity;
          REVOKE ALL ON SCHEMA identity FROM PUBLIC;
          SQL

      # Generated per run and discarded with the job's database. It signs nothing that
      # outlives the run, and no secret literal enters the repository. Exported once so the
      # migration and the tests agree — a mismatch would fail to decrypt the signing key,
      # which is exactly what BETTER_AUTH_SECRET rotation does to a real deployment.
      - name: Auth contract tests
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
          pnpm --filter web migrate:identity
          pnpm --filter web test

      - run: pnpm --filter web build

  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # Real Postgres and Redis: the tenant-isolation suite asserts Row-Level Security
    # behavior, which cannot be faked, mocked, or run against SQLite. An "integration"
    # tier without real infrastructure would prove nothing (BACKEND_SPEC.md §8).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omniai
          POSTGRES_PASSWORD: omniai
          POSTGRES_DB: omniai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omniai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      LOG_LEVEL: warning
      DATABASE_URL: postgresql+asyncpg://omniai_app:omniai_app@localhost:5432/omniai
      DATABASE_ADMIN_URL: postgresql+asyncpg://omniai:omniai@localhost:5432/omniai
      REDIS_URL: redis://localhost:6379/0
      # Object storage → the MinIO container started below (M1.4-B0.5). Ephemeral CI-only
      # credentials; APP_ENV=development lets the store accept the plaintext MinIO endpoint.
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: omniai-dev
      R2_REGION: auto
      # Disposable CI-only credential master key (base64 of 32 bytes). Never decrypts production
      # data; production supplies its own via the platform secret store (SECURITY §2.1).
      CREDENTIAL_MASTER_KEY: sGnwe2+XJ43hHei5jRF+HsbYFVaj7gz5RQDriXxI4R4=

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Service containers do not run /docker-entrypoint-initdb.d, so the least-privileged
      # role is provisioned explicitly. It must exist before migrating: the migration's
      # preflight refuses to run without it, and refuses if it is a superuser.
      - name: Provision the application DB role
        run: |
          PGPASSWORD=omniai psql -h localhost -U omniai -d omniai -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE omniai_app LOGIN PASSWORD 'omniai_app';
          GRANT CONNECT ON DATABASE omniai TO omniai_app;
          SQL

      # Better Auth owns human identity in apps/web, in its own schema through its own role
      # (ADR-0014). Mirrors infra/docker/postgres-init/02-identity-role.sh, which service
      # containers never run. `omniai_app` is granted nothing — that absence is the boundary,
      # and tests/integration/test_identity_boundary.py asserts it.
      - name: Provision the Better Auth identity schema
        run: |
          PGPASSWORD=omniai psql -h localhost -U omniai -d omniai -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE omniai_identity LOGIN PASSWORD 'omniai_identity';
          GRANT CONNECT ON DATABASE omniai TO omniai_identity;
          CREATE SCHEMA IF NOT EXISTS identity AUTHORIZATION omniai_identity;
          REVOKE ALL ON SCHEMA identity FROM PUBLIC;
          SQL

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Create Better Auth's tables before the Alembic steps below, for two reasons.
      #
      # Without them the placement assertions would be vacuous: "no Better Auth table exists
      # in public" passes trivially when no Better Auth table exists anywhere, and a green
      # test proving nothing is worse than no test.
      #
      # And running this *before* `alembic downgrade base` is what turns the reversibility
      # check into a proof. That downgrade executes `DROP SCHEMA auth CASCADE`; the suite
      # then asserts `identity` is still intact. Choosing a schema Alembic already owned
      # would fail right here, which is exactly how this module found that hazard.
      #
      # Since M1.3-B the provider is also STARTED: the human-auth E2E tests sign in against
      # the real Better Auth and the API's verifier fetches its real JWKS — those tests
      # fail rather than skip when the provider is absent, deliberately. One secret is
      # exported for the whole step so the migration, the running server, and the jwks row
      # it mints all agree; a mismatch is exactly the failed-decrypt outage ADR-0014
      # documents. The secret is generated per-run and dies with the job's database.
      - name: Apply Better Auth's schema and start the provider
        working-directory: ${{ github.workspace }}
        env:
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_DATABASE_URL: postgresql://omniai_identity:omniai_identity@localhost:5432/omniai
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
          pnpm install --frozen-lockfile
          pnpm --filter web migrate:identity
          # `next dev`, not `next start` — deliberately. `next start` runs with
          # NODE_ENV=production, and the M1.3-D boot guard in apps/web/src/lib/auth.ts
          # correctly REFUSES to start a production server on an http:// BETTER_AUTH_URL
          # (it would issue session cookies without the Secure attribute). CI's provider is
          # a localhost http test fixture, so it must run in development mode — exactly as
          # the docker-compose `web` service does. Weakening the guard to make prod boot on
          # http would defeat the very control M1.3-D added.
          nohup pnpm --filter web dev > /tmp/better-auth-web.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:3000/api/auth/jwks > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/auth/jwks > /dev/null || {
            echo "Better Auth provider failed to start"; tail -50 /tmp/better-auth-web.log; exit 1;
          }

      # --frozen: fail if uv.lock is stale rather than re-resolving (P-59).
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app

      # DATABASE_DESIGN.md §5.2 requires exactly one head; multiple heads mean two PRs
      # branched the migration graph and the merge is not actually mergeable.
      - name: Assert a single Alembic head
        run: |
          heads=$(uv run alembic heads | grep -c . || true)
          test "$heads" -eq 1 || { echo "expected 1 alembic head, found $heads"; exit 1; }

      - run: uv run alembic upgrade head

      # Every migration ships a working downgrade (P-42). Proving it in CI is the only way
      # to know the rollback path works before the night you need it.
      - name: Verify migrations are reversible
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      # Object storage for the B0.5 integration tests (M1.4-B0.5). MinIO cannot be a GHA
      # `services:` container — the minio image needs a `server /data` command that `services`
      # cannot pass — so it runs as a background container with an explicit readiness wait. The
      # test fixture creates the bucket via ensure_bucket(); the credentials are CI-only and die
      # with the job. The tests fail (never silently skip) if this MinIO is unreachable.
      - name: Start MinIO (S3-compatible object storage)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live || {
            echo "MinIO failed to start"; docker logs minio; exit 1;
          }

      - run: uv run pytest -q

  security:
    name: Security — secret scan
    runs-on: ubuntu-latest
    # This repository's default GITHUB_TOKEN is read-only over contents/metadata/packages.
    # On a `pull_request` event gitleaks-action calls GET /repos/{o}/{r}/pulls/{n}/commits
    # to scan only the PR's commits, which needs `pull-requests: read` — without it the
    # action dies on a 403 ("Resource not accessible by integration") *before scanning
    # anything*, so the job fails without ever having looked for a secret.
    # Granted at job level, not workflow level, so no other job gains the scope.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker — images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build the *production* targets. Building only `dev` is how a broken prod image
      # ships unnoticed — the web prod stage was copying a directory Next.js was never
      # configured to emit, and CI could not have caught it.
      - name: API image (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
