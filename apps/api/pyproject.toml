[project]
name = "omniai-api"
version = "0.1.0"
description = "OmniAI Connect backend — FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "redis>=5.2",
    "celery>=5.4",
    "structlog>=24.4",
    # UUIDv7 primary keys (DATABASE_DESIGN.md §1). Not in the stdlib until Python 3.14.
    # uuid6 is pure Python (no Rust toolchain, no wheel-availability risk in slim images)
    # and returns a real uuid.UUID, so it binds directly to SQLAlchemy's Uuid type —
    # uuid-utils returns a foreign type needing conversion at every boundary. (P-60)
    "uuid6>=2024.7.10",
    # Human JWT verification against Better Auth's JWKS (ADR-0015). The [crypto]
    # extra pulls `cryptography` for EdDSA/Ed25519 — the observed signing algorithm.
    # PyJWT's API requires an explicit algorithms allowlist, which is the property
    # that makes algorithm-confusion unrepresentable rather than merely tested-for.
    "pyjwt[crypto]>=2.10",
    # Async S3-compatible client for object storage (M1.4-B0.5): Cloudflare R2 in production,
    # MinIO in local/CI — one S3 API, selected by endpoint. aioboto3 wraps aiobotocore so the
    # storage path is non-blocking like the rest of the request/worker path (async-first, P-*);
    # pure-Python, so no wheel/compiler risk in the slim image. Isolated behind app.core
    # .object_store — no application code imports boto3/botocore directly (ADR-0024).
    "aioboto3>=13.0",
    # OpenAPI/Swagger specs are JSON or YAML (M1.4-B1). PyYAML's `safe_load` is used
    # exclusively — never `load`/`unsafe_load` — so a hostile spec cannot construct Python
    # objects or execute code. Parsing is confined to app/domains/connectors/openapi.py.
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Celery's `@app.task` decorator is untyped in the library, which strict mode flags on every
# task. The task bodies themselves are fully typed and checked; only the decorator is exempt.
[[tool.mypy.overrides]]
module = [
    "app.workers.tasks",
    "app.workers.oauth_tasks",
    "app.workers.vault_tasks",
    "app.workers.notification_tasks",
]
disallow_untyped_decorators = false

# Celery and Kombu ship no type stubs / py.typed marker; our own code stays fully typed.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

# aioboto3/aiobotocore/botocore ship no usable py.typed for strict mode (botocore is
# dynamically generated and returns dict[str, Any]). The untyped surface is confined to
# app/core/object_store.py, whose own public API is fully typed; Any never escapes it.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "aiobotocore.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
