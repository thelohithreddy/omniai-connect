name: omniai-connect

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omniai
      POSTGRES_PASSWORD: omniai
      POSTGRES_DB: omniai
      # Consumed by the init script below to provision the least-privileged app role.
      APP_DB_USER: omniai_app
      APP_DB_PASSWORD: omniai_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first initialisation of an empty data directory. After changing
      # anything here: docker compose down -v && make dev
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for local/CI (M1.4-B0.5, ADR-0024). Production uses Cloudflare
  # R2; the application speaks only the S3 API, selected by R2_ENDPOINT. Credentials here are
  # development-only (never production R2 secrets). The console (9001) is a local convenience;
  # it is not part of any deployed surface.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Deterministic bucket initialisation: wait for MinIO, then create the dev bucket idempotently
  # and exit. api/worker gate on this completing, so the bucket always exists before they run.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      ["/bin/sh", "-c",
       "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/omniai-dev; exit 0"]

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: dev
    env_file: .env
    environment:
      # The app connects as the non-superuser, non-owner role so RLS actually applies.
      DATABASE_URL: postgresql+asyncpg://omniai_app:omniai_app@db:5432/omniai
      # Alembic only. Owns the schema; never serves a request.
      DATABASE_ADMIN_URL: postgresql+asyncpg://omniai:omniai@db:5432/omniai
      REDIS_URL: redis://redis:6379/0
      # JWKS fetch address inside the compose network (ADR-0015 §5). The public
      # issuer stays BETTER_AUTH_URL; only the fetch location differs in here.
      BETTER_AUTH_JWKS_URL: http://web:3000/api/auth/jwks
      # Object storage → MinIO on the compose network (M1.4-B0.5). Dev-only credentials; these
      # override whatever .env carries so local storage always targets the compose MinIO.
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: omniai-dev
      R2_REGION: auto
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: dev
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web:/repo/apps/web
      - /repo/apps/web/node_modules
      - /repo/apps/web/.next

  # Celery ingestion worker (M1.4-B0.2, ADR-0021). Reuses the API image (one image, a
  # different command — it runs `celery worker`, never uvicorn) and consumes ONLY the
  # `ingestion` queue. It publishes no port, exposes no HTTP surface, and is NOT `env_file:
  # .env` — its environment is scoped by hand so it never inherits BETTER_AUTH_SECRET,
  # Stripe/Resend, or any frontend/API secret it has no need for (§19). It DOES receive
  # object-storage credentials from B0.5 on, because the ingestion worker stores fetched specs
  # in R2 (CONNECTOR_SPECIFICATION §18) — here those are the dev-only MinIO credentials, never
  # production R2 secrets. DB URL is the non-superuser app role (B0.3 tenant work).
  worker:
    # One image, a different command: reuse the API image built above rather than a second
    # build (§16). In production the same prod image runs this `celery worker` command.
    image: omniai-connect-api
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://omniai_app:omniai_app@db:5432/omniai
      APP_ENV: development
      LOG_LEVEL: info
      # Object storage → MinIO (dev-only credentials). The worker writes ingested specs to R2.
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      R2_BUCKET: omniai-dev
      R2_REGION: auto
    command:
      ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "ingestion",
       "--concurrency=2", "--loglevel=INFO", "--without-gossip", "--without-mingle"]
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./apps/api:/app

volumes:
  pgdata:
  miniodata:
